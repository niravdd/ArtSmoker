<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtSmoker — AI Art Asset Generator</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <!-- Tailwind Play CDN: versionless JIT compiler, no stable artifact to hash — SRI N/A (deliberate no-build-step choice) -->
    <script src="https://cdn.tailwindcss.com"></script> <!-- nosemgrep -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            bg: '#0f172a',
                            surface: '#1e293b',
                            accent: '#6366f1',
                            'accent-hover': '#818cf8',
                            'accent-muted': '#4f46e5',
                            text: '#e2e8f0',
                            'text-muted': '#94a3b8',
                            border: '#334155',
                        }
                    }
                }
            }
        }
    </script>
    <!-- CJK font support for Japanese, Chinese, Korean -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <!-- Markdown + Code highlighting for Chat Studio.
         These CDN assets are version-pinned + SRI-hashed (supply-chain safe).
         To upgrade one: bump the version in its URL, then regenerate its
         integrity="…" via  scripts/compute-sri.sh <new-url>  and paste it.
         Pinned: highlight.js 11.9.0 · marked 12.0.2 · model-viewer 3.5.0 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"
          integrity="sha384-wH75j6z1lH97ZOpMOInqhgKzFkAInZPPSPlZpYKYTOqsaizPvhQZmAtLcPKXpLyH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"
            integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"
            integrity="sha384-F/bZzf7p3Joyp5psL90p/p89AZJsndkSoGwRpXcZhleCWhd8SnRuoYo4d0yirjJp" crossorigin="anonymous"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"
            integrity="sha384-Ftcjj/GNLxPvzNDftO/oryXB9aGxsGZY9JGqsXG0uUKgQDl9RfDgsx9NJ/4IVNPe" crossorigin="anonymous"></script>
</head>
<body class="bg-brand-bg text-brand-text min-h-screen flex flex-col antialiased">

    <!-- Top Navigation Bar -->
    <nav class="sticky top-0 z-50 bg-brand-surface/95 backdrop-blur-md border-b border-brand-border shadow-lg">
        <div class="max-w-[90rem] mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Logo + Tagline -->
                <a href="#image-studio" class="flex items-center gap-3 group">
                    <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-brand-accent to-purple-500 flex items-center justify-center shadow-md group-hover:shadow-brand-accent/30 transition-shadow">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
                        </svg>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-xl font-bold bg-gradient-to-r from-brand-accent to-purple-400 bg-clip-text text-transparent leading-tight">
                            ArtSmoker
                        </span>
                        <span class="text-[11px] text-brand-text-muted/70 leading-tight hidden sm:block" data-i18n="app.tagline">Smoke-testing your artwork!</span>
                    </div>
                </a>

                <!-- Desktop Navigation Links -->
                <div class="hidden sm:flex items-center gap-1">
                    <a href="#styles" class="nav-link px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200 hover:bg-white/5" data-nav="styles">
                        <svg class="w-4 h-4 inline-block mr-1.5 -mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"/>
                        </svg>
                        <span data-i18n="nav.style_library">Style Library</span>
                    </a>
                    <a href="#image-studio" class="nav-link px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200 hover:bg-white/5" data-nav="image-studio">
                        <svg class="w-4 h-4 inline-block mr-1.5 -mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                        </svg>
                        <span data-i18n="nav.image_studio">Image Studio</span>
                    </a>
                    <a href="#type-studio" class="nav-link px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200 hover:bg-white/5" data-nav="type-studio">
                        <svg class="w-4 h-4 inline-block mr-1.5 -mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h8m-8 6h16"/>
                        </svg>
                        <span data-i18n="nav.type_studio">Type Studio</span>
                    </a>
                    <a href="#video-studio" class="nav-link px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200 hover:bg-white/5" data-nav="video-studio">
                        <svg class="w-4 h-4 inline-block mr-1.5 -mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                        <span data-i18n="nav.video_studio">Video Studio</span>
                    </a>
                    <a href="#chat-studio" class="nav-link px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200 hover:bg-white/5" data-nav="chat-studio">
                        <svg class="w-4 h-4 inline-block mr-1.5 -mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                        </svg>
                        <span data-i18n="nav.chat_studio">Chat Studio</span>
                    </a>
                    <a href="#gallery" class="nav-link px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200 hover:bg-white/5" data-nav="gallery">
                        <svg class="w-4 h-4 inline-block mr-1.5 -mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                        </svg>
                        <span data-i18n="nav.gallery">Gallery</span>
                    </a>
                </div>

                <!-- Language Switcher -->
                <div class="hidden sm:flex items-center gap-0.5 ml-2" id="lang-switcher"></div>

                <!-- Mobile Menu Button -->
                <button id="mobile-menu-btn" class="sm:hidden p-2 rounded-lg text-brand-text-muted hover:bg-white/5 transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Mobile Navigation Menu -->
        <div id="mobile-menu" class="hidden sm:hidden border-t border-brand-border">
            <div class="px-4 py-3 space-y-1">
                <a href="#styles" class="nav-link block px-4 py-2 rounded-lg text-sm font-medium transition-colors hover:bg-white/5" data-nav="styles"><span data-i18n="nav.style_library">Style Library</span></a>
                <a href="#image-studio" class="nav-link block px-4 py-2 rounded-lg text-sm font-medium transition-colors hover:bg-white/5" data-nav="image-studio"><span data-i18n="nav.image_studio">Image Studio</span></a>
                <a href="#type-studio" class="nav-link block px-4 py-2 rounded-lg text-sm font-medium transition-colors hover:bg-white/5" data-nav="type-studio"><span data-i18n="nav.type_studio">Type Studio</span></a>
                <a href="#video-studio" class="nav-link block px-4 py-2 rounded-lg text-sm font-medium transition-colors hover:bg-white/5" data-nav="video-studio"><span data-i18n="nav.video_studio">Video Studio</span></a>
                <a href="#chat-studio" class="nav-link block px-4 py-2 rounded-lg text-sm font-medium transition-colors hover:bg-white/5" data-nav="chat-studio"><span data-i18n="nav.chat_studio">Chat Studio</span></a>
                <a href="#gallery" class="nav-link block px-4 py-2 rounded-lg text-sm font-medium transition-colors hover:bg-white/5" data-nav="gallery"><span data-i18n="nav.gallery">Gallery</span></a>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-1">
        <div id="app" class="max-w-[90rem] mx-auto px-4 sm:px-6 lg:px-8 py-6">
            <!-- Views are rendered here by the router -->
        </div>
    </main>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="fixed inset-0 z-[100] bg-brand-bg/80 backdrop-blur-sm flex items-center justify-center hidden">
        <div class="flex flex-col items-center gap-4">
            <div class="loading-spinner w-12 h-12 border-4 border-brand-accent/20 border-t-brand-accent rounded-full"></div>
            <p id="loading-text" class="text-brand-text-muted text-sm font-medium" data-i18n="app.loading">Loading...</p>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-[90] flex flex-col gap-3 pointer-events-none">
    </div>

    <!-- Scripts -->
    <!-- Loaded in dependency order (i18n → api → components → app.js). No
         ?v= cache-bust query: the version is NOT hard-coded here. Freshness
         across releases is guaranteed by NoCacheStaticMiddleware, which sends
         `Cache-Control: no-cache, no-store` on every static asset, and app.js
         fetches the version from /api/health for the footer display. -->
    <script src="js/i18n/i18n.js"></script>
    <script src="js/html.js"></script>
    <script src="js/services/api.js"></script>
    <script src="js/components/VoiceInput.js"></script>
    <script src="js/components/PromptEditor.js"></script>
    <script src="js/components/PromptDesigner.js"></script>
    <script src="js/components/ReferenceStudio.js"></script>
    <script src="js/components/AssetViewer.js"></script>
    <script src="js/components/StyleLibrary.js"></script>
    <script src="js/components/ImageStudio.js"></script>
    <script src="js/components/TypeStudio.js"></script>
    <script src="js/components/VideoStudio.js"></script>
    <script src="js/components/Gallery.js"></script>
    <script src="js/components/ChatStudio.js"></script>
    <script src="js/components/ModelSettings.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
